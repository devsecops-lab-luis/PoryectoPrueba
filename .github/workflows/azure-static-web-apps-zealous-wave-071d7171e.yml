
name: Azure Static Web Apps CI/CD

on:
  push:
    branches:
      - main

  pull_request:
    branches:
      - main
    types:
      - opened
      - synchronize
      - reopened

permissions:
  contents: read

jobs:
  # ============================================================
  # BUILD
  # Se ejecuta tanto en Pull Requests como en main.
  # NO necesita el token de Azure.
  # ============================================================
  build:
    name: Build Frontend
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: ./frontend

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Build frontend
        run: npm run build

  # ============================================================
  # DEPLOY
  # SOLO se ejecuta cuando hay PUSH a main.
  # Aquí sí utilizamos el secreto de Azure.
  # ============================================================
  deploy:
    name: Deploy to Azure Static Web Apps
    runs-on: ubuntu-latest

    needs: build

    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Deploy to Azure Static Web Apps
        uses: Azure/static-web-apps-deploy@v1
        with:
          azure_static_web_apps_api_token: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN_ZEALOUS_WAVE_071D7171 }}
          repo_token: ${{ secrets.GITHUB_TOKEN }}
          action: upload

          # Carpeta donde está el proyecto Vite
          app_location: "./frontend"

          # No tenemos API
          api_location: ""

          # Carpeta generada por npm run build
          output_location: "dist"
